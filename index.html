<meta name="theme-color" content="#0b6bcb" media="(prefers-color-scheme: light)">

<header class="topbar" id="topbar">

  </button>

<main id="app" class="app"><!-- obrazovky sa vykresľujú sem --></main>

    <div class="sheet__actions" id="sheetActions"></div>
  </div>
</div>
