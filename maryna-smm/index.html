<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marck+Script&family=Noto+Serif:wght@400;600&family=Playfair+Display:wght@700&display=swap">
<style>
/* VOICE occasion: a young SMM manager's portfolio for her first clients, elegant and hushed
   IDEA her own lookbook: grey cover stock, oxblood pages and script headings, as in her slides
   PICTURE the presentation itself, slide after slide, each opening full screen on tap
   COLOUR grey #e6e6e6 ground, oxblood #360000 bands, ink #250000, blush #e1d8d9, wine #8c1c2c accent
   TYPE Playfair Display + Noto Serif, Great Vibes for script headings
   LAYOUT laptop: name left, links and button right, slides in one wide column; phone: name, button, slides full width */
:root{color-scheme:light;--bg:#e6e6e6;--ink:#250000;--ox:#360000;--blush:#e1d8d9;--wine:#8c1c2c;--milk:#f3eded}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Serif",Georgia,serif;overflow-x:clip;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.band{padding-block:clamp(28px,4vw,64px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1000px;margin-inline:auto}
.head{padding-bottom:clamp(18px,2.4vw,28px)}
.head .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px}
.who{margin-right:auto}
h1{margin:0;font:700 clamp(40px,6vw,56px)/1.05 "Playfair Display",Georgia,serif;letter-spacing:-.02em}
.role{margin:4px 0 0;font:400 clamp(26px,3.2vw,34px)/1.1 "Great Vibes","Marck Script",cursive;color:var(--wine)}
.links{display:flex;flex-wrap:wrap;gap:0 20px}
.links a{display:inline-block;padding:11px 0;text-decoration:none;border-bottom:1px solid transparent}
.links a:hover{border-bottom-color:currentColor}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 22px;border-radius:999px;background:var(--ox);color:var(--milk);text-decoration:none;font-weight:600;white-space:nowrap;transition:background .2s}
.btn:hover{background:var(--wine)}
.btn svg{width:20px;height:20px;flex:none}
.deck-band{padding-top:0}
.deck{display:grid;gap:clamp(14px,2.2vw,26px)}
.slide{position:relative;display:block;width:100%;padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--ox);cursor:zoom-in;box-shadow:0 0 0 1px rgba(37,0,0,.14),0 3px 10px -4px rgba(37,0,0,.3)}
.slide:first-child{background:var(--bg)}
.slide img{width:100%;height:auto;aspect-ratio:16/9}
.hint{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:#5e3a3d}
.hint svg{width:16px;height:16px;flex:none}
.dark{background:var(--ox);color:var(--milk)}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px;margin-bottom:22px}
h2{margin:0;font-weight:400}
.script{font:400 clamp(44px,5.4vw,58px)/1 "Great Vibes","Marck Script",cursive}
.sub{margin:0;opacity:.82}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,40vw),1fr));gap:12px}
.tile{position:relative;aspect-ratio:9/16;padding:0;border:0;border-radius:12px;overflow:hidden;background:#1d0000;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.pi{position:absolute;left:10px;bottom:10px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff}
.pi svg{width:15px;height:15px}
.st .tile{padding:3px;background:linear-gradient(160deg,var(--wine),var(--blush))}
.st .tile img{border-radius:9px}
.foot{background:var(--ink);color:var(--milk)}
.foot .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px}
.foot h2{font:700 clamp(32px,4.4vw,48px)/1.05 "Playfair Display",Georgia,serif;letter-spacing:-.02em}
.btn.lt{background:var(--milk);color:var(--ink)}
.btn.lt:hover{background:var(--blush)}
.ov{position:fixed;inset:0;z-index:20;background:#120000;color:#fff;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track figure{flex:0 0 100%;display:grid;place-items:center;margin:0;padding:64px 16px;scroll-snap-align:center}
.track img{width:auto;height:auto;max-width:min(100%,1600px);max-height:calc(100vh - 140px);border-radius:6px}
.ctl{position:absolute;z-index:3;display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.ctl:hover{background:rgba(255,255,255,.26)}
.ctl svg{width:22px;height:22px}
.x{top:12px;right:12px}
.pv{left:12px;top:50%;margin-top:-24px}
.nx{right:12px;top:50%;margin-top:-24px}
.cap{position:absolute;left:0;right:0;bottom:16px;margin:0;text-align:center;font-size:14px;line-height:1.4;color:#e9dede;pointer-events:none}
.rbtn{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);display:none;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:15px;white-space:nowrap;cursor:pointer}
.rbtn svg{width:18px;height:18px}
.pl{display:grid;place-items:center}
.frame{position:relative;height:min(92vh,880px);aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.frame video,.frame img{width:100%;height:100%;object-fit:contain}
.bars{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.bars b{display:block;width:0;height:100%;background:#fff}
.frame .x{top:22px;right:10px}
.frame .mu{top:22px;right:66px}
@media(max-width:600px){.ov .pv,.ov .nx{display:none}.frame{width:100%;height:100%;border-radius:0;aspect-ratio:auto}.head .btn{flex:1 1 auto;justify-content:center}}
@media(max-width:600px) and (orientation:portrait){
.rbtn{display:inline-flex}
#lb.r .track{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory}
#lb.r .track figure{padding:16px;overflow:hidden}
#lb.r .track img{max-width:calc(100vh - 190px);max-width:calc(100svh - 190px);max-height:calc(100vw - 40px);transform:rotate(90deg)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="band head">
  <div class="wrap">
    <div class="who">
      <h1>Марина</h1>
      <p class="role">Social Media Manager</p>
    </div>
    <nav class="links" id="nav" aria-label="Розділи"></nav>
    <a class="btn" href="https://instagram.com/maryna_zmr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>Написати в Instagram</a>
  </div>
</header>

<main>
  <section id="presentation" class="band deck-band">
    <h2 class="vh">Презентація</h2>
    <div class="wrap">
      <p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>Натисніть на слайд, щоб відкрити на весь екран</p>
      <div class="deck" id="deck"></div>
    </div>
  </section>

  <section id="video" class="band dark" hidden>
    <div class="wrap">
      <div class="sec-h"><h2 class="script">Відео</h2><p class="sub">Натисніть, щоб переглянути зі звуком</p></div>
      <div class="grid" id="vGrid"></div>
    </div>
  </section>

  <section id="stories" class="band" hidden>
    <div class="wrap">
      <div class="sec-h"><h2 class="script">Сторіс</h2><p class="sub">Натисніть, щоб переглянути</p></div>
      <div class="grid st" id="sGrid"></div>
    </div>
  </section>
</main>

<footer id="contacts" class="band foot">
  <div class="wrap">
    <h2>Напишіть мені</h2>
    <a class="btn lt" href="https://instagram.com/maryna_zmr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>Instagram @maryna_zmr</a>
  </div>
</footer>

<div class="ov" id="lb" role="dialog" aria-modal="true" aria-label="Презентація на весь екран" hidden>
  <div class="track" id="lbTrack"></div>
  <button class="ctl x" id="lbX" type="button" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="ctl pv" id="lbP" type="button" aria-label="Попередній слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ctl nx" id="lbN" type="button" aria-label="Наступний слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="rbtn" id="lbR" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg><span>Збільшити</span></button>
  <p class="cap" id="lbCount"></p>
</div>

<div class="ov pl" id="pl" role="dialog" aria-modal="true" aria-label="Перегляд" hidden>
  <div class="frame" id="frame">
    <div class="bars" id="bars"></div>
    <video id="plV" playsinline preload="auto"></video>
    <img id="plI" alt="" hidden>
    <button class="ctl mu" id="plM" type="button" aria-label="Вимкнути звук"></button>
    <button class="ctl x" id="plX" type="button" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <button class="ctl pv" id="plP" type="button" aria-label="Попереднє"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ctl nx" id="plN" type="button" aria-label="Наступне"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
{
const SLIDES=[
  ['1','Обкладинка: Social Media Manager, портфоліо Марини'],
  ['2','Хто я. Я Марина, менеджер з маркетингу. Допомагаю бізнесам виходити на новий рівень у соціальних мережах. Пишу SMM-стратегії та створюю весь контент. Навички: Figma, Canva, VN, InShot, CapCut.'],
  ['3','Пакет 1: написання стратегії, контент-план, 2 пости в тиждень (8–10 постів на місяць), 2 зйомки на місяць, 2–4 сторіс у день 5 днів на тиждень. 450 € зі зйомками, 350 € без зйомок.'],
  ['4','Пакет 2: написання стратегії, контент-план, 3 пости в тиждень (10–12 постів на місяць), 2–3 зйомки на місяць, 5/6 у день 6 днів на тиждень. 550 € зі зйомками, 450 € без зйомок.'],
  ['5','Додаткові послуги, відео (reels). Базовий монтаж: 12 € за відео 15–30 с, 18 € за відео 1 хв; склейка кадрів, фонова музика, субтитри до озвучки. Довше відео за домовленістю.'],
  ['6','Покращений монтаж: 17 € за відео 15–30 с, 28 € за відео 1 хв; субтитри вручну, візуальний супровід (меми, картинки, вставки), звуковий дизайн. Довше відео за домовленістю.'],
  ['7','Дизайн каруселі: 20 € за карусель до 5–7 слайдів. Структурування тексту, дизайн усіх слайдів, обкладинка та фінальний слайд із закликом до дії.']
];
/* {src:'video/1.mp4',poster:'video/1.jpg'} */
const VIDEOS=[{src:'video/1.mp4',poster:'video/1.jpg'},{src:'video/2.mp4',poster:'video/2.jpg'},{src:'video/3.mp4',poster:'video/3.jpg'},{src:'video/4.mp4',poster:'video/4.jpg'}];
/* {src:'stories/1.mp4',poster:'stories/1.jpg'} або фото {src:'stories/2.jpg',img:1} */
const STORIES=[{src:'stories/1.jpg',img:1},{src:'stories/2.jpg',img:1},{src:'stories/3.jpg',img:1},{src:'stories/4.jpg',img:1},{src:'stories/5.jpg',img:1},{src:'stories/6.jpg',img:1},{src:'stories/7.jpg',img:1},{src:'stories/8.jpg',img:1},{src:'stories/9.jpg',img:1},{src:'stories/10.mp4',poster:'stories/10.jpg'},{src:'stories/11.jpg',img:1},{src:'stories/12.jpg',img:1},{src:'stories/13.jpg',img:1},{src:'stories/14.jpg',img:1},{src:'stories/15.jpg',img:1},{src:'stories/16.jpg',img:1},{src:'stories/17.jpg',img:1},{src:'stories/18.jpg',img:1},{src:'stories/19.jpg',img:1},{src:'stories/20.jpg',img:1},{src:'stories/21.jpg',img:1},{src:'stories/22.jpg',img:1},{src:'stories/23.jpg',img:1},{src:'stories/24.jpg',img:1},{src:'stories/25.jpg',img:1},{src:'stories/26.jpg',img:1},{src:'stories/27.jpg',img:1},{src:'stories/28.jpg',img:1},{src:'stories/29.jpg',img:1},{src:'stories/30.jpg',img:1},{src:'stories/31.jpg',img:1},{src:'stories/32.jpg',img:1},{src:'stories/33.jpg',img:1},{src:'stories/34.jpg',img:1},{src:'stories/35.jpg',img:1},{src:'stories/36.jpg',img:1},{src:'stories/37.mp4',poster:'stories/37.jpg'},{src:'stories/38.jpg',img:1},{src:'stories/39.jpg',img:1},{src:'stories/40.jpg',img:1},{src:'stories/41.jpg',img:1},{src:'stories/42.jpg',img:1},{src:'stories/43.mp4',poster:'stories/43.jpg'},{src:'stories/44.jpg',img:1},{src:'stories/45.jpg',img:1},{src:'stories/46.jpg',img:1},{src:'stories/47.jpg',img:1},{src:'stories/48.jpg',img:1}];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
  zoom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4.5v15l12-7.5z"/></svg>',
  on:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  off:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

$('#deck').innerHTML=SLIDES.map(([f,a],i)=>`<button class="slide" type="button" data-i="${i}"><img src="slides/${f}-m.jpg" srcset="slides/${f}-m.jpg 960w, slides/${f}.jpg 1920w" sizes="(max-width:1100px) 92vw, 1000px" width="1920" height="1080" alt="${esc(a)}" ${i?'loading="lazy"':'fetchpriority="high"'} decoding="async"></button>`).join('');
$('#lbTrack').innerHTML=SLIDES.map(([f,a])=>`<figure><img src="slides/${f}.jpg" width="1920" height="1080" alt="${esc(a)}" loading="lazy" decoding="async"></figure>`).join('');

const tiles=(arr,g)=>arr.map((it,i)=>`<button class="tile" type="button" data-g="${g}" data-i="${i}" aria-label="${g==='v'?'Відео':'Сторіс'} ${i+1}"><img src="${esc(it.poster||it.src)}" alt="" loading="lazy" decoding="async"><span class="pi" aria-hidden="true">${it.img?ICON.zoom:ICON.play}</span></button>`).join('');
$('#vGrid').innerHTML=tiles(VIDEOS,'v');
$('#sGrid').innerHTML=tiles(STORIES,'s');
$('#video').hidden=!VIDEOS.length;
$('#stories').hidden=!STORIES.length;

const secs=[['presentation','Презентація'],['video','Відео'],['stories','Сторіс'],['contacts','Контакти']].filter(([id])=>!document.getElementById(id).hidden);
const nav=$('#nav');
if(secs.length>2)nav.innerHTML=secs.map(([id,t])=>`<a href="#${id}" data-to="${id}">${t}</a>`).join('');
else nav.hidden=true;

let back=null;
const lock=on=>document.body.classList.toggle('lock',on);

/* slides full screen */
const lb=$('#lb'),tr=$('#lbTrack'),cnt=$('#lbCount'),rb=$('#lbR');
const mq=matchMedia('(max-width:600px) and (orientation:portrait)');
let rot=false,cur=0;
const vert=()=>rot&&mq.matches;
const idx=()=>vert()?Math.round(tr.scrollTop/Math.max(1,tr.clientHeight)):Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
const to=(i,smooth)=>tr.scrollTo(vert()?{top:i*tr.clientHeight,behavior:smooth?'smooth':'auto'}:{left:i*tr.clientWidth,behavior:smooth?'smooth':'auto'});
const upd=()=>{cur=idx();cnt.textContent=`${cur+1} / ${SLIDES.length}`};
function openLb(i){back=document.activeElement;lb.hidden=false;lock(true);to(i);upd();$('#lbX').focus({preventScroll:true})}
function closeLb(){lb.hidden=true;lock(false);if(back)back.focus({preventScroll:true})}
function go(d){to(Math.max(0,Math.min(SLIDES.length-1,idx()+d)),true)}
rb.addEventListener('click',()=>{const i=cur;rot=!rot;lb.classList.toggle('r',rot);rb.setAttribute('aria-pressed',String(rot));rb.querySelector('span').textContent=rot?'Зменшити':'Збільшити';to(i);upd()});
addEventListener('resize',()=>{if(lb.hidden)return;const i=cur;requestAnimationFrame(()=>{to(i);upd()})});
tr.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
tr.addEventListener('click',e=>{if(e.target.tagName==='FIGURE')closeLb()});
$('#lbX').addEventListener('click',closeLb);
$('#lbP').addEventListener('click',()=>go(-1));
$('#lbN').addEventListener('click',()=>go(1));

/* videos and stories player */
const pl=$('#pl'),fr=$('#frame'),v=$('#plV'),im=$('#plI'),bars=$('#bars'),mu=$('#plM');
const IMG_MS=5000;
let list=[],k=0,raf=0,t0=0,pAt=0,paused=false,blob='';
const syncMute=()=>{mu.innerHTML=v.muted?ICON.off:ICON.on;mu.setAttribute('aria-label',v.muted?'Увімкнути звук':'Вимкнути звук')};
function play(){const p=v.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError'&&!v.muted){v.muted=true;syncMute();v.play().catch(()=>{})}})}
function tick(){
  const it=list[k],b=bars.children[k]&&bars.children[k].firstChild;
  let p=0;
  if(it.img){p=((paused?pAt:performance.now())-t0)/IMG_MS;if(p>=1){next();return}}
  else if(v.duration)p=v.currentTime/v.duration;
  if(b)b.style.width=Math.min(100,p*100)+'%';
  raf=requestAnimationFrame(tick);
}
function show(){
  cancelAnimationFrame(raf);paused=false;
  if(blob){URL.revokeObjectURL(blob);blob=''}
  [...bars.children].forEach((b,j)=>{b.firstChild.style.width=j<k?'100%':'0%'});
  const it=list[k];
  mu.hidden=!!it.img;
  if(it.img){v.pause();v.removeAttribute('src');v.hidden=true;im.hidden=false;im.src=it.src;t0=performance.now();raf=requestAnimationFrame(tick)}
  else{im.hidden=true;im.removeAttribute('src');v.hidden=false;v.poster=it.poster||'';v.dataset.fb='';v.src=it.src;play()}
}
function next(){if(k<list.length-1){k++;show()}else closePl()}
function prev(){if(k>0)k--;show()}
function pause(){if(paused)return;paused=true;pAt=performance.now();if(!list[k].img)v.pause()}
function resume(){if(!paused)return;paused=false;t0+=performance.now()-pAt;if(!list[k].img)play()}
function openPl(arr,i){list=arr;k=i;back=document.activeElement;pl.hidden=false;lock(true);bars.innerHTML=list.map(()=>'<i><b></b></i>').join('');syncMute();show();$('#plX').focus({preventScroll:true})}
function closePl(){cancelAnimationFrame(raf);v.pause();v.removeAttribute('src');v.load();if(blob){URL.revokeObjectURL(blob);blob=''}pl.hidden=true;lock(false);if(back)back.focus({preventScroll:true})}
v.addEventListener('playing',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
v.addEventListener('ended',next);
v.addEventListener('error',()=>{
  const it=list[k];
  if(pl.hidden||!it||it.img||v.dataset.fb)return;
  v.dataset.fb='1';
  fetch(it.src).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>{if(list[k]!==it||pl.hidden)return;blob=URL.createObjectURL(b);v.src=blob;play()}).catch(()=>{});
});
let hold=0,held=false,down=false;
fr.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;held=false;clearTimeout(hold);hold=setTimeout(()=>{held=true;pause()},220)});
fr.addEventListener('pointerup',e=>{if(!down)return;down=false;clearTimeout(hold);if(held){held=false;resume();return}const r=fr.getBoundingClientRect();if(e.clientX-r.left<r.width/3)prev();else next()});
fr.addEventListener('pointercancel',()=>{down=false;clearTimeout(hold);if(held){held=false;resume()}});
fr.addEventListener('contextmenu',e=>e.preventDefault());
mu.addEventListener('click',()=>{v.muted=!v.muted;syncMute()});
$('#plX').addEventListener('click',closePl);
$('#plP').addEventListener('click',prev);
$('#plN').addEventListener('click',next);
pl.addEventListener('click',e=>{if(e.target===pl)closePl()});

document.addEventListener('click',e=>{
  const s=e.target.closest('.slide');if(s){openLb(+s.dataset.i);return}
  const t=e.target.closest('.tile');if(t){openPl(t.dataset.g==='v'?VIDEOS:STORIES,+t.dataset.i);return}
  const a=e.target.closest('.links a');if(a){e.preventDefault();document.getElementById(a.dataset.to).scrollIntoView({behavior:'smooth'})}
});
document.addEventListener('keydown',e=>{
  if(!lb.hidden){if(e.key==='Escape')closeLb();else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)}
  else if(!pl.hidden){if(e.key==='Escape')closePl();else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();paused?resume():pause()}}
});
}
</script>
